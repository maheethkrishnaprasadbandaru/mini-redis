[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mini-redis-educational"
version = "0.14.0"
description = "A standard-library Redis-inspired educational database server"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
miniredis = "miniredis.server:main"
miniredis-benchmark = "miniredis.benchmark:main"

[tool.setuptools.packages.find]
include = ["miniredis*"]
